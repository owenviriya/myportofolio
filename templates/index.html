{% extends "base.html" %}
{% load static %}

{% block meta %}
    <title>{{ name }} - Portfolio</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="hero" id="profile">
        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">
                    <span>Computer Science</span>
                    <span class="hero-kicker-separator"> &middot; </span>
                    <br class="hero-kicker-break">
                    <span>Universitas Indonesia</span>
                </p>

                <h1>{{ name }}</h1>
            </div>

            <div class="hero-photo">
                <div class="photo-block"></div>
                <img
                    class="avatar"
                    src="{% static 'img/foto.png' %}"
                    alt="Photo of {{ name }}"
                >
            </div>

            <div class="hero-details">
                <p class="bio">{{ bio }}</p>

                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>

                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                </dl>

                <div class="social-links">
                    <a href="https://github.com/owenviriya"
                       class="social-link">
                        GitHub
                    </a>

                    <a href="https://www.linkedin.com/in/owen-viriya-chandra/"
                       class="social-link">
                        LinkedIn
                    </a>

                    <a href="mailto:owennnviriyaaa@gmail.com"
                       class="social-link">
                        Email
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
